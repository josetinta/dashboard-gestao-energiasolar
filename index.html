*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#14161a;font-family:'Space Mono',monospace;color:#eaeaea}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1c1c1c 0,#0e0e0e 60%),#14161a}
#stage>*,#dyn>*{position:absolute}
.bx>*{position:absolute}
svg{display:block;overflow:visible}
svg text{font-family:'Space Mono',monospace}
a{text-decoration:none;color:inherit}
.rw{cursor:pointer}
.mo{font-family:'Space Mono',monospace}
.cd{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.lb{font:700 10.5px 'Space Mono',monospace;letter-spacing:2px;color:#9a9a9a;text-transform:uppercase;white-space:nowrap}
.tg{height:28px;line-height:28px;text-align:center;font:700 10.5px 'Space Mono',monospace;letter-spacing:1.4px;color:#8d8d8d;cursor:pointer;border-radius:3px;white-space:nowrap;text-transform:uppercase}
.tg:hover{color:#fff}
.tg.on{background:linear-gradient(180deg,#ffb35c,#ee7a2c);color:#1d1307;box-shadow:0 0 14px rgba(242,138,56,.45)}
.ib{display:flex;align-items:center;justify-content:center;border:1px solid #333;background:#191919;border-radius:4px;color:#ddd;cursor:pointer}
.ib:hover{border-color:#f28a38;color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3a3a3a;background:#1c1c1c;border-radius:4px;color:#eee;font:700 10.5px 'Space Mono',monospace;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#f28a38}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#f28a38;color:#1d1307;font:700 11px 'Space Mono',monospace;padding:5px 9px;white-space:nowrap;border-radius:3px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(980px,96vw);height:min(560px,90vh);background:#161616;border:1px solid #333;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1d1d1d;border-bottom:1px solid #2f2f2f}
#sheet .tp b{flex:1;font:700 14px 'Space Mono',monospace;color:#fff;letter-spacing:1px;text-transform:uppercase}
#sheet button{height:30px;padding:0 14px;border:1px solid #444;border-radius:4px;background:#222;color:#eee;font:700 11px 'Space Mono',monospace;cursor:pointer}
#sheet button:hover{border-color:#f28a38}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font:12.5px 'Space Mono',monospace;width:100%}
#sheet th{position:sticky;top:0;background:#1d1d1d;color:#f28a38;padding:8px 10px;text-align:right;white-space:nowrap;border:1px solid #2c2c2c}
#sheet td{padding:6px 10px;border:1px solid #262626;text-align:right;color:#e8e8e8;white-space:nowrap}
#sheet th:first-child,#sheet td:first-child{text-align:left}
#sheet td[contenteditable]:focus{outline:2px solid #f28a38;background:#202020}
#note{outline:none}
</style></head>
